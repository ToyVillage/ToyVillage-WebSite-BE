spring:
  datasource:
    url: jdbc:mysql://localhost:3306/toyvillage_test
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  mail:
    host: localhost
    port: 3025
    username: test
    password: test
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: ap-northeast-2
      s3:
        region: ap-northeast-2
        bucket: test-bucket
        endpoint:

cors:
  allowed-origins:
    local: http://localhost:8080
    dev: http://localhost:3000
    main: http://localhost:3000

redis:
  host: localhost
  port: 6379

jwt:
  secret-key: test-secret-key-test-secret-key-test-secret-key-test-secret-key
  accessExpiration: 3600000
  refreshExpiration: 604800000
  header: Authorization
  prefix: Bearer

app:
  cookie:
    secure: false
